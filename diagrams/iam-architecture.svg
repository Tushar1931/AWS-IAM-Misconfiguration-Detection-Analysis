<svg width="680" height="445" viewBox="0 0 680 445" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- AWS Account outer container -->
  <rect x="20" y="20" width="640" height="405" rx="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="40" y="44" font-size="11" font-weight="500" fill="#5F5E5A">AWS Account</text>

  <!-- ── ROW 1: Users ─────────────────────────────────────────── -->

  <!-- analyst-user (teal: least privilege) -->
  <rect x="50" y="55" width="188" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="144" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">analyst-user</text>
  <text x="144" y="96" text-anchor="middle" font-size="12" fill="#0F6E56">Restricted — ViewOnly</text>

  <!-- dev-user (coral: misconfigured) -->
  <rect x="278" y="55" width="188" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="372" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">dev-user</text>
  <text x="372" y="96" text-anchor="middle" font-size="12" fill="#993C1D">Misconfigured account</text>

  <!-- ── ROW 2: Access controls ──────────────────────────────── -->

  <!-- Arrow: analyst-user → LimitedAccess group -->
  <line x1="144" y1="111" x2="144" y2="155" stroke="#888780" stroke-width="0.5" marker-end="url(#arr-gray)"/>

  <!-- Arrow: dev-user → LimitedAccess group (dashed — group membership) -->
  <path d="M 318 111 L 318 134 L 144 134 L 144 155" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>

  <!-- Arrow: dev-user → Over-permissive policy (solid warning — direct attachment) -->
  <line x1="406" y1="111" x2="406" y2="155" stroke="#854F0B" stroke-width="1" marker-end="url(#arr-warn)"/>
  <text x="412" y="134" font-size="10" fill="#854F0B">Direct attach</text>

  <!-- LimitedAccess Group (purple) -->
  <rect x="50" y="155" width="188" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="144" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">LimitedAccess group</text>
  <text x="144" y="196" text-anchor="middle" font-size="12" fill="#534AB7">ViewOnlyAccess policy</text>

  <!-- Over-permissive Policy (amber — risk) -->
  <rect x="278" y="155" width="188" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="372" y="175" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">Custom policy  [!]</text>
  <text x="372" y="193" text-anchor="middle" font-size="12" fill="#854F0B">Action: *   Resource: *</text>

  <!-- Warning annotation below over-permissive -->
  <text x="372" y="225" text-anchor="middle" font-size="11" fill="#854F0B">Violates least privilege principle</text>

  <!-- ── AWS Services (right column) ─────────────────────────── -->
  <rect x="496" y="50" width="148" height="180" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text x="570" y="72" text-anchor="middle" font-size="11" font-weight="500" fill="#5F5E5A">AWS Services</text>

  <rect x="512" y="82" width="116" height="36" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
  <text x="570" y="105" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">IAM</text>

  <rect x="512" y="128" width="116" height="36" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
  <text x="570" y="151" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">EC2</text>

  <rect x="512" y="174" width="116" height="36" rx="6" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
  <text x="570" y="197" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">S3</text>

  <!-- Arrow: Over-permissive policy → AWS Services (unrestricted access) -->
  <path d="M 466 183 L 494 160" fill="none" stroke="#854F0B" stroke-width="1" marker-end="url(#arr-warn)"/>
  <text x="472" y="175" text-anchor="middle" font-size="10" fill="#854F0B">Unrestricted</text>

  <!-- ── DIVIDER ──────────────────────────────────────────────── -->
  <line x1="40" y1="250" x2="640" y2="250" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="6 4"/>
  <text x="340" y="246" text-anchor="middle" font-size="10" fill="#888780">Audit Logging Layer</text>

  <!-- Arrow: Services → CloudTrail (API activity captured) -->
  <path d="M 570 230 L 570 272 L 144 272 L 144 303" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="588" y="264" font-size="10" fill="#185FA5">API logs</text>

  <!-- ── ROW 3: Logging ──────────────────────────────────────── -->

  <!-- CloudTrail SecurityTrail (blue) -->
  <rect x="50" y="303" width="196" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="148" y="326" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">SecurityTrail</text>
  <text x="148" y="344" text-anchor="middle" font-size="12" fill="#185FA5">Multi-region CloudTrail</text>

  <!-- Arrow: CloudTrail → S3 -->
  <line x1="246" y1="331" x2="282" y2="331" stroke="#185FA5" stroke-width="0.5" marker-end="url(#arr-blue)"/>

  <!-- S3 Log Bucket (green) -->
  <rect x="282" y="303" width="196" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="380" y="326" text-anchor="middle" font-size="14" font-weight="500" fill="#27500A">S3 Log Bucket</text>
  <text x="380" y="344" text-anchor="middle" font-size="12" fill="#3B6D11">Encrypted (SSE-S3)</text>

  <!-- ── LEGEND ───────────────────────────────────────────────── -->
  <text x="50" y="390" font-size="11" font-weight="500" fill="#5F5E5A">Legend</text>

  <rect x="104" y="379" width="11" height="11" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="119" y="390" font-size="10" fill="#444441">Least-privilege user</text>

  <rect x="240" y="379" width="11" height="11" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="255" y="390" font-size="10" fill="#444441">Misconfigured user</text>

  <rect x="371" y="379" width="11" height="11" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="386" y="390" font-size="10" fill="#444441">Over-permissive policy</text>

  <rect x="503" y="379" width="11" height="11" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="518" y="390" font-size="10" fill="#444441">Audit logging</text>

  <!-- Title caption -->
  <text x="340" y="416" text-anchor="middle" font-size="11" fill="#888780">AWS IAM Misconfiguration Detection &amp; Analysis — Architecture Diagram</text>

</svg>
